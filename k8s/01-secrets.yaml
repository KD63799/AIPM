apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: prompt-manager
type: Opaque
stringData:
  # Base de données
  POSTGRES_USER: 'app_user'
  POSTGRES_PASSWORD: 'CHANGE_MOI_MDP_FORT_DB' # ⚠️ À changer
  POSTGRES_DB: 'app_db'

  # Redis
  REDIS_PASSWORD: 'CHANGE_MOI_MDP_FORT_REDIS' # ⚠️ À changer
  REDIS_URL: 'redis://:CHANGE_MOI_MDP_FORT_REDIS@redis:6379' # ⚠️ Même mot de passe que ci-dessus

  # JWT
  JWT_SECRET: 'SUPER_SECRET_POUR_TOKENS' # ⚠️ À changer
